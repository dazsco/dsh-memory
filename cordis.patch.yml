# Bundle patch for the dsh-memory plugin: inserts the memory service row into
# the profile roster. Installed with `dsh plugin --profile web add <package>`
# or `dsh plugin --profile web add link:<repo path>`.
#
# The row hosts the whole memory system (store, capture, recall, rules, Dream)
# as ONE process-global service: memory is shared across sessions by design,
# so the provider belongs in the host plane (profile composition), never in an
# agent preset.
#
# The row id is the settings namespace: the plugin declares its whole memory
# configuration as this row's `Config`, whose volatile fields DSH projects into
# the live form (Settings → Plugins → dsh-memory). The plugin ships NO `config:`
# block here on purpose — every field's schema default is the production
# default, and a value written here would sit in the composition layer and
# shadow the deployment's own session model for `llm.provider`/`llm.model`.
# Pin a route by adding `config: { llm: { provider: ..., model: ... } }` to this
# entry (or by editing it in the GUI, which writes the user layer instead).
- insert:
    - id: dsh-memory
      name: 'dsh-memory'
